[project]
name = "hooke"
version = "0.1.0"
description = "Agentic workflow automator: a systemd daemon that watches files and schedules periodic tasks, running each automation through your agent"
readme = "README.md"
authors = [
    { name = "Aditya Azad", email = "adityaazad121@gmail.com" }
]
requires-python = ">=3.14"
dependencies = ["watchfiles>=1.0"]

[project.scripts]
hooke = "hooke:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8",
    "ruff>=0.17.2",
]
